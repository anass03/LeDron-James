[package]
name = "simulation_controller"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.9.1"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
crossbeam-channel = "0.5.13"
toml = "0.8.19"
colored = "2.0"
crossterm = "0.29.0"
ratatui = "0.29.0"
ratatui-image = "5.0.0"
image = "0.25.6"
rodio = "0.17"
tui-textarea = "0.7.0"
log = "0.4.27"
petgraph = "0.7.1"
infer = "0.19.0"
tui-popup = "0.7.0-alpha.0"
ratatui-explorer = "0.2.0"
tui-scrollview = "0.5.1"

wg_2024 = { git = "https://github.com/WGL-2024/WGL_repo_2024.git", features = ["serialize"]}
wg_internal = { git = "https://github.com/WGL-2024/WGL_repo_2024"}
LeDron_James = { git = "https://github.com/anass03/LeDron_James.git",default-features = false}

drone = { path = "../drone"}
initializer_utils = { path = "../initializer_utils" } # FIX TO ERROR CYCLIC PACKAGE DEPENDENCY

client = { git = "https://github.com/anass03/LeDron-James.git", branch = "client", package = "client"}
host = { git = "https://github.com/anass03/LeDron-James.git", branch = "client", package = "host"}
server = { git = "https://github.com/anass03/LeDron-James.git", branch = "server"}
textwrap = "0.16.2"



