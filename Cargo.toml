[package]
name = "LeDron-James"
version = "0.1.0"
edition = "2021"

[net]
git-fetch-with-cli = true

[dependencies]
wg_2024 = { git = "https://github.com/WGL-2024/WGL_repo_2024.git"}
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
toml = "0.8.19"
crossbeam-channel = "0.5.13"
initializer = { path = "src/initializer" }
ratatui = "0.29.0"

client = { git = "https://github.com/anass03/LeDron-James.git", branch = "client", package = "client"}
host = { git = "https://github.com/anass03/LeDron-James.git", branch = "client", package = "host"}
server = { git = "https://github.com/anass03/LeDron-James.git", branch = "server"}

simulation_controller = { path = "src/simulation_controller" }
tracing-subscriber = "0.3.19"

# Specify local libraries in the project
[workspace]
members = [
    "src/drone",
    "src/initializer", "src/initializer_utils",
    "src/simulation_controller"
]
